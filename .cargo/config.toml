[alias]
xtask = "run --package xtask --"

[build]
# Use a Linux target so rust-analyzer can resolve aya's Linux-only libc symbols.
# The daemon uses aya (eBPF) which only compiles on Linux; without this, cargo
# check on macOS fails for the entire workspace and rust-analyzer goes blind.
#
# IMPORTANT: Inside the Lima ARM64 build VM this default must be overridden so
# that `cargo xtask` compiles and runs as native aarch64 (not x86_64).
# The Makefile dev-build / dev-build-ebpf targets do this via:
#   cargo --config 'build.target="aarch64-unknown-linux-gnu"' xtask build-ebpf
# Explicit --target flags (e.g. --target x86_64-unknown-linux-gnu) are
# unaffected and continue to cross-compile correctly.
target = "x86_64-unknown-linux-gnu"
