services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: prototype_net
      POSTGRES_USER: prototype
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped

  client:
    build: ./client
    cap_add:
      - NET_ADMIN
    privileged: true
    environment:
      DNS_SERVER: ${SERVER_VM_IP}
      SERVER_IP: ${SERVER_VM_IP}
    volumes:
      - ./certs/output:/certs:ro
    networks:
      default:
        ipv6_address: "fd00:dead::2"
    restart: unless-stopped

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: "172.19.0.0/16"
        - subnet: "fd00:dead::/64"

volumes:
  pgdata:
