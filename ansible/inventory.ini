# ansible/inventory.ini
#
# Generated/filled after `make vm-up` — set VM_IP in .env first.
# Usage: ansible-playbook -i ansible/inventory.ini ansible/site.yml
#
# The VM_IP is read from the environment / .env file by the Makefile.
# You can also run directly:
#   ansible-playbook -i "192.168.100.X," -u ubuntu ansible/site.yml \
#     -e @ansible/vars.yml

[server]
prototype-net-server ansible_host=${VM_IP} ansible_user=ubuntu
