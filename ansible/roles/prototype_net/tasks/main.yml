---
# ansible/roles/prototype_net/tasks/main.yml

# ---------------------------------------------------------------------------
# Packages
# ---------------------------------------------------------------------------

- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required packages
  apt:
    name:
      - strongswan
      - strongswan-swanctl
      - strongswan-charon
      - libcharon-extra-plugins
      - linux-tools-generic   # provides bpftool
      - curl
      - iproute2
      - net-tools
    state: present

# ---------------------------------------------------------------------------
# sysctl — IPv6 forwarding
# ---------------------------------------------------------------------------

- name: Configure sysctl for IPv6 forwarding
  copy:
    dest: /etc/sysctl.d/99-prototype-net.conf
    content: |
      net.ipv6.conf.all.forwarding=1
      net.ipv6.conf.default.forwarding=1
      # Disable XFRM policy re-check on xfrm0 after eBPF has already rewritten
      # the packet addresses — the inbound XFRM check runs against the original
      # (pre-eBPF) addresses, so re-checking the rewritten packet would find no
      # matching policy and silently drop it.
      net.ipv6.conf.xfrm0.disable_policy=1
    owner: root
    group: root
    mode: "0644"
  notify: Apply sysctl

# ---------------------------------------------------------------------------
# systemd-resolved — disable stub listener so dns-server can own port 53
# ---------------------------------------------------------------------------

- name: Create systemd-resolved drop-in directory
  file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Disable systemd-resolved stub listener
  copy:
    dest: /etc/systemd/resolved.conf.d/disable-stub.conf
    content: |
      [Resolve]
      DNSStubListener=no
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-resolved

# ---------------------------------------------------------------------------
# strongSwan config
# ---------------------------------------------------------------------------
# NOTE: XFRM kernel policies are generated exclusively by strongSwan via its
# VICI interface when a child SA is established.  Do NOT add manual XFRM
# policies with "ip xfrm policy add" — they are not managed here, will not
# survive a strongSwan reload/restart, and can mask real policy mismatches
# during debugging.  If stale permissive policies are found (reqid=0, src/dst
# ::/0), remove them with:
#   sudo ip xfrm policy delete src ::/0 dst ::/0 dir fwd
#   sudo ip xfrm policy delete src ::/0 dst ::/0 dir in
# The net.ipv6.conf.xfrm0.disable_policy=1 sysctl (set above) makes
# strongSwan's policies irrelevant for traffic that has already been rewritten
# by eBPF — but all other interfaces still rely on correct XFRM policies.
# ---------------------------------------------------------------------------

- name: Create strongSwan swanctl config directory
  file:
    path: /etc/swanctl/conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write strongSwan IKEv2 server config
  copy:
    dest: /etc/swanctl/conf.d/prototype.conf
    content: |
      pools {
          client_pool {
              addrs = fd00:abcd:0:1::1:0-fd00:abcd:0:1::ffff:ffff
          }
      }
      connections {
          prototype {
              version = 2
              proposals = aes256-sha256-ecp384
              rekey_time = 4h
              pools = client_pool
              local {
                  auth = pubkey
                  certs = server.crt
                  id = %any
              }
              remote {
                  auth = pubkey
                  cacerts = ca.crt
              }
              children {
                  prototype {
                      esp_proposals = aes256gcm128
                      local_ts = ::/0
                      remote_ts = fd00:abcd::/32
                      mode = tunnel
                      if_id_in = 1
                      if_id_out = 1
                      start_action = none
                      dpd_action = clear
                  }
              }
          }
      }
    owner: root
    group: root
    mode: "0644"

# ---------------------------------------------------------------------------
# Binary directory
# ---------------------------------------------------------------------------

- name: Create binary directory
  file:
    path: /opt/prototype_net
    state: directory
    owner: root
    group: root
    mode: "0755"

# ---------------------------------------------------------------------------
# Systemd units
# ---------------------------------------------------------------------------

- name: Write prototype-xfrm0 systemd unit
  copy:
    dest: /etc/systemd/system/prototype-xfrm0.service
    content: |
      [Unit]
      Description=Create xfrm0 XFRM interface for prototype_net
      After=network-online.target
      Wants=network-online.target
      # Re-run on network events so xfrm0 is re-created if the interface is removed
      PartOf=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      # Idempotent: only create xfrm0 if it does not already exist.
      # The old "ExecStartPre=-ip link del xfrm0" unconditionally destroyed the
      # interface (and any TC attachments on it) on every restart — replaced here
      # with a conditional add that is a no-op when xfrm0 is already healthy.
      ExecStart=/bin/sh -c 'ip link show xfrm0 >/dev/null 2>&1 || ip link add xfrm0 type xfrm if_id 1 dev enp0s3'
      ExecStart=/sbin/ip link set xfrm0 up

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Write prototype-daemon systemd unit
  copy:
    dest: /etc/systemd/system/prototype-daemon.service
    content: |
      [Unit]
      Description=prototype_net eBPF daemon
      After=network-online.target strongswan-starter.service prototype-xfrm0.service
      Wants=network-online.target
      # BindsTo ensures the daemon is restarted whenever prototype-xfrm0 is
      # restarted (e.g. xfrm0 interface recreated), so TC attachments are
      # always re-established after any xfrm0 teardown.
      BindsTo=prototype-xfrm0.service

      [Service]
      Type=simple
      ExecStart=/opt/prototype_net/daemon
      Environment=DATABASE_URL=postgres://prototype:{{ postgres_password }}@{{ host_bridge_ip }}:5432/prototype_net
      Environment=INTERFACE_NAME=xfrm0
      Environment=WAN_INTERFACE=enp0s3
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Write prototype-dns-server systemd unit
  copy:
    dest: /etc/systemd/system/prototype-dns-server.service
    content: |
      [Unit]
      Description=prototype_net DNS server
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      ExecStart=/opt/prototype_net/dns-server
      Environment=DATABASE_URL=postgres://prototype:{{ postgres_password }}@{{ host_bridge_ip }}:5432/prototype_net
      Environment=LISTEN_ADDR={{ dns_listen_addr }}:53
      Restart=on-failure
      RestartSec=5
      AmbientCapabilities=CAP_NET_BIND_SERVICE

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

# ---------------------------------------------------------------------------
# Enable services (they start once binaries + certs are deployed)
# ---------------------------------------------------------------------------

- name: Enable prototype-xfrm0 service
  systemd:
    name: prototype-xfrm0.service
    enabled: true
    daemon_reload: true

- name: Write prototype-swanctl-load systemd unit
  copy:
    dest: /etc/systemd/system/prototype-swanctl-load.service
    content: |
      [Unit]
      Description=Load strongSwan swanctl connections after charon starts
      After=strongswan-starter.service
      BindsTo=strongswan-starter.service
      # Re-run whenever strongswan-starter restarts so connections are always loaded
      PartOf=strongswan-starter.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      # Retry until the VICI socket is ready (charon may not expose it immediately)
      ExecStartPre=/bin/sh -c 'for i in $(seq 1 20); do test -S /var/run/charon.vici && break; sleep 1; done'
      ExecStart=/usr/sbin/swanctl --load-all
      Restart=on-failure
      RestartSec=3

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable prototype-swanctl-load service
  systemd:
    name: prototype-swanctl-load.service
    enabled: true
    daemon_reload: true

- name: Enable strongswan-starter service
  systemd:
    name: strongswan-starter.service
    enabled: true
    daemon_reload: true

- name: Enable prototype-daemon service
  systemd:
    name: prototype-daemon.service
    enabled: true
    daemon_reload: true

- name: Enable prototype-dns-server service
  systemd:
    name: prototype-dns-server.service
    enabled: true
    daemon_reload: true
