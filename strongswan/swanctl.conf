connections {
    prototype {
        version = 2
        proposals = aes256-sha256-ecp384
        rekey_time = 4h

        local {
            auth = pubkey
            certs = server.crt
            id = %any
        }

        remote {
            auth = pubkey
            cacerts = ca.crt
        }

        children {
            prototype {
                esp_proposals = aes256gcm128
                local_ts = ::/0
                remote_ts = fd00:abcd::/32
                mode = tunnel
                start_action = none
                dpd_action = clear
            }
        }
    }
}

# Certificate paths (default strongSwan locations):
#   /etc/swanctl/x509/server.crt
#   /etc/swanctl/private/server.key
#   /etc/swanctl/x509ca/ca.crt
