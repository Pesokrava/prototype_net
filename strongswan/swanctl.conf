pools {
    client_pool {
        # Dynamically assign per-client IPv6 addresses from this range.
        # ::1 through ::ff are reserved (server addresses, static test fixtures).
        # Addresses are released when the IKEv2 SA is torn down.
        addrs = fd00:abcd:0:1::1:0-fd00:abcd:0:1::ffff:ffff
    }
}

connections {
    prototype {
        version = 2
        proposals = aes256-sha256-ecp384
        rekey_time = 4h

        # Assign each connecting client a unique IPv6 address from the pool
        # via IKEv2 Configuration Payload (CP).
        pools = client_pool

        local {
            auth = pubkey
            certs = server.crt
            id = %any
        }

        remote {
            auth = pubkey
            cacerts = ca.crt
        }

        children {
            prototype {
                esp_proposals = aes256gcm128
                local_ts = ::/0
                remote_ts = fd00:abcd::/32
                mode = tunnel
                if_id_in = 1
                if_id_out = 1
                start_action = none
                dpd_action = clear
            }
        }
    }
}

# Certificate paths (default strongSwan locations):
#   /etc/swanctl/x509/server.crt
#   /etc/swanctl/private/server.key
#   /etc/swanctl/x509ca/ca.crt
