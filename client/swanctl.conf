connections {
    prototype {
        version = 2
        proposals = aes256-sha256-ecp384
        rekey_time = 4h

        # Server address — substituted at container startup
        remote_addrs = %SERVER_IP%

        # Request a virtual IPv6 address from the server's pool via IKEv2 CP.
        vips = 0::0

        local {
            auth = pubkey
            certs = client.crt
            id = CN=test-client
        }

        remote {
            auth = pubkey
            cacerts = ca.crt
        }

        children {
            prototype {
                esp_proposals = aes256gcm128
                local_ts = fd00:abcd::/32
                remote_ts = ::/0
                mode = tunnel
                if_id_in = 1
                if_id_out = 1
                start_action = start
                dpd_action = restart
            }
        }
    }
}

# Certificate paths (default strongSwan locations):
#   /etc/swanctl/x509/client.crt
#   /etc/swanctl/private/client.key
#   /etc/swanctl/x509ca/ca.crt
