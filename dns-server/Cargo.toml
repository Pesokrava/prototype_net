[package]
name = "dns-server"
version = "0.1.0"
edition = "2024"

[dependencies]
hickory-server = "0.25.2"
hickory-resolver = "0.25.2"
common = { path = "../common", features = ["userspace"] }
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "chrono"] }
tokio = { version = "1.50.0", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
