#cloud-config
users:
  - name: ubuntu
    groups: [sudo, adm]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: false
    ssh_authorized_keys:
      - ${ssh_public_key}

# Drop the networkd-wait-online timeout override before first boot.
# write_files runs during cloud-init-local — the very first stage — before
# systemd can block on networkd-wait-online and freeze the boot.
write_files:
  - path: /etc/systemd/system/systemd-networkd-wait-online.service.d/timeout.conf
    permissions: '0644'
    content: |
      [Service]
      TimeoutStartSec=5
      ExecStart=
      ExecStart=/lib/systemd/systemd-networkd-wait-online --timeout=5

packages:
  - qemu-guest-agent

runcmd:
  - [systemctl, enable, --now, qemu-guest-agent]
